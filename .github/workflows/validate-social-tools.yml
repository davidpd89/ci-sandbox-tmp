name: Validar herramientas RRSS sin acceso a cuentas

on:
  # Valida toda PR del mirror, incluso si solo cambia configuración.
  pull_request:
  push:
    branches: [main]
  # En dispatch se ejecuta solo la suite offline, no existe base de diff.
  workflow_dispatch:

permissions:
  contents: read

# Si una PR recibe un commit nuevo, la ejecución anterior ya no valida su último código.
# Separar grupos por workflow y PR; no cancelar ejecuciones manuales ni main.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline:
    name: offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # El mirror público valida cada PR tanto en Ubuntu como en Windows.
        # En el repo privado las PR entre ramas de trabajo solo usan Ubuntu.
        os: ${{ fromJSON(github.repository == 'davidpd89/ci-sandbox-tmp' && '["ubuntu-latest","windows-latest"]' || github.event_name == 'pull_request' && github.base_ref != 'main' && '["ubuntu-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    timeout-minutes: 10
    env:
      CI: 'true'
    steps:
      - name: Checkout PR o manual (merge sintético si es PR)
        if: github.event_name != 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Checkout push (before puede abarcar múltiples commits)
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: No aceptar artefactos operativos ni rutas sensibles en cambios de la PR
        # HEAD^1 es la base del merge sintético exclusivamente en pull_request.
        # En push/dispatch HEAD^1 sería el commit previo, no la base de una PR.
        if: github.event_name == 'pull_request'
        run: python tools/repo_hygiene.py --base "HEAD^1"
      - name: No aceptar artefactos operativos ni rutas sensibles en push completo
        if: github.event_name == 'push'
        run: python tools/push_hygiene.py
      - name: Instalar dependencias de pruebas
        run: python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Comprobar sintaxis sin conectar redes
        run: python -m compileall -q tools tests
      - name: Ejecutar regresiones offline
        run: python -m pytest tests -q -p no:cacheprovider --deselect tests/test_bluesky_growth_docs.py::BlueskyGrowthDocsTests::test_daily_docs_use_orchestrated_state_ai_and_report_files --deselect tests/test_bluesky_growth_docs.py::BlueskyGrowthDocsTests::test_hot_path_points_to_growth_flow_not_legacy_scan --deselect tests/test_language_variety.py::LanguageVarietyTests::test_real_repository_history_is_readable_without_schema_or_status_errors --deselect tests/test_loyalty_writer.py::WriterRulesTests::test_prompt_has_memory_feedback_rule_and_reply_to_us --deselect tests/test_metricool_retired.py::MetricoolRetiredTests::test_common_publisher_refuses_before_media --deselect tests/test_metricool_retired.py::MetricoolRetiredTests::test_operational_entrypoints_mark_metricool_retired --deselect tests/test_reddit_publish.py::StatesFileTests::test_real_bank_and_states_are_consistent
