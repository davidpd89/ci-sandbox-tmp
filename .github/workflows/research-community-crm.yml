name: CRM community offline (PR 25)

on:
  push:
    branches:
      - research/15-community-crm-loyalty
    paths:
      - tools/community_crm.py
      - tests/test_community_crm.py
      - .github/workflows/research-community-crm.yml
  pull_request:
    branches: [research/public-reuse-parent]
    paths:
      - tools/community_crm.py
      - tests/test_community_crm.py
      - .github/workflows/research-community-crm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  community-crm-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Test CRM with synthetic offline fixtures
        run: python -m unittest discover -s tests -p test_community_crm.py -v
      - name: Compile without imports of live adapters
        run: python -m py_compile tools/community_crm.py
