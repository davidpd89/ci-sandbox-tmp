name: Validate stable aliases offline
on:
  push:
    branches:
      - research/85-stable-account-alias-reconciliation
  pull_request:
    paths:
      - tools/stable_account_aliases.py
      - tests/test_stable_account_aliases.py
      - tests/test_native_alias_observations.py
      - tools/native_alias_observations.py
      - .github/workflows/validate-stable-aliases.yml
permissions:
  contents: read
jobs:
  alias-offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Offline Python 3.11 unittest
        run: |
          python -m unittest discover -s tests -p test_stable_account_aliases.py -v
          python -m unittest discover -s tests -p test_native_alias_observations.py -v
      - name: Static compilation
        run: python -m py_compile tools/stable_account_aliases.py tools/native_alias_observations.py tests/test_stable_account_aliases.py tests/test_native_alias_observations.py
