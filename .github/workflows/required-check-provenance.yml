name: Trusted check provenance (default branch only)

# This job is NOT active until the workflow is installed in the default branch.
# Running it from PR code, or requiring only its mutable name, is not an
# independently enforced trust boundary. See the runbook.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions: {}

jobs:
  audit:
    name: trusted-check-provenance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout ONLY default-branch trusted inspector
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install maintained YAML parser
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps PyYAML==6.0.3
      - name: Inspect all proposed workflow job identities via read-only API
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
          TARGET_PR: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          python tools/required_check_provenance.py \
            --repo "$TARGET_REPO" --number "$TARGET_PR" \
            --head "$EXPECTED_HEAD" --base "$EXPECTED_BASE"
