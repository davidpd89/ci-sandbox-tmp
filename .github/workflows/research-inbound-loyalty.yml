name: Inbound loyalty projection offline (PR 69)

on:
  push:
    branches:
      - research/59-inbound-engagement-loyalty
    paths:
      - tools/inbound_loyalty_priority.py
      - tests/test_inbound_loyalty_priority.py
      - .github/workflows/research-inbound-loyalty.yml
      - docs/research/inbound-engagement-loyalty.md
  pull_request:
    branches: [research/public-reuse-parent]
    paths:
      - tools/inbound_loyalty_priority.py
      - tests/test_inbound_loyalty_priority.py
      - .github/workflows/research-inbound-loyalty.yml
      - docs/research/inbound-engagement-loyalty.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbound-loyalty-offline:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Run synthetic contracts without remote sessions
        run: python -m unittest discover -s tests -p test_inbound_loyalty_priority.py -v
      - name: Compile offline projection
        run: python -m py_compile tools/inbound_loyalty_priority.py
