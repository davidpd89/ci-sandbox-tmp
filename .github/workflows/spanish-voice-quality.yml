name: Spanish voice quality offline

on:
  pull_request:
    paths:
      - 'tools/spanish_voice_*.py'
      - 'tools/reply_writer.py'
      - 'tools/content_publisher.py'
      - 'tests/test_spanish_voice_quality.py'
      - 'tests/fixtures/spanish_voice_pairs.json'
      - '.github/workflows/spanish-voice-quality.yml'
  push:
    branches: ['research/69-spanish-voice-locale-quality']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Dependencia de tildes ya utilizada por el repositorio
        run: python -m pip install --disable-pip-version-check "pyspellchecker>=0.8,<1"
      - name: Test offline
        run: python -m unittest discover -s tests -p test_spanish_voice_quality.py -v
      - name: Comprobar reutilización efectiva de diccionario español
        run: python -c "import sys; sys.path.insert(0, 'tools'); from spanish_voice_quality import audit; r = audit('la musica del bosque', network='x'); assert r['accent_check'] == 'enabled' and any(x['code'] == 'possible_missing_accent' for x in r['findings']), r"
      - name: Benchmark sintético
        run: python tools/spanish_voice_eval.py tests/fixtures/spanish_voice_pairs.json
