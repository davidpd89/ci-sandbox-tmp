name: Required check provenance synthetic regressions (untrusted)
on:
  pull_request:
  push:
    branches: [ci/required-check-provenance]

permissions:
  contents: read

jobs:
  synthetic:
    name: provenance-tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check --only-binary=:all: --no-deps PyYAML==6.0.3
      - name: Synthetic suite only (does NOT satisfy independent gate)
        run: python -m unittest discover -s tests -p test_required_check_provenance.py -v
