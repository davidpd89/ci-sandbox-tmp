name: Voice output finalization (offline)

on:
  pull_request:
    paths:
      - 'tools/voice_output_finalization.py'
      - 'tools/x_bank_publish.py'
      - 'tools/reddit_publish.py'
      - 'tools/reddit_interact.py'
      - 'tools/reddit_comments.py'
      - 'tools/tiktok_mobile_interact.py'
      - 'tools/pinterest_publish.py'
      - 'tools/content_publisher.py'
      - 'tools/content_queue_alert.py'
      - 'tests/test_voice_output_finalization.py'
      - '.github/workflows/voice-output-finalization.yml'
  push:
    branches: ['research/voice-output-finalization-parity']

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile affected modules
        run: python -m compileall -q tools/voice_output_finalization.py tools/x_bank_publish.py tools/reddit_publish.py tools/reddit_comments.py tools/reddit_interact.py tools/tiktok_mobile_interact.py tools/pinterest_publish.py tools/content_publisher.py tools/content_queue_alert.py
      - name: Unit tests (synthetic, no social network)
        run: python -m unittest discover -s tests -p test_voice_output_finalization.py -v
