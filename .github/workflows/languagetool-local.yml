name: Test LanguageTool local adapter (offline)

on:
  pull_request:
    branches: [research/public-reuse-parent]
    paths:
      - 'tools/languagetool_local.py'
      - 'tests/test_languagetool_local.py'
      - '.github/workflows/languagetool-local.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Python 3.11 offline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Offline synthetic tests, no JVM or accounts
        run: python -m unittest discover -s tests -p test_languagetool_local.py -v
