name: Relationship ledger offline contract

on:
  push:
    branches:
      - research/74-relationship-event-ledger
    paths:
      - 'tools/relationship_event_ledger.py'
      - 'tests/test_relationship_event_ledger.py'
      - '.github/workflows/relationship-event-ledger.yml'
      - 'docs/research/relationship-event-ledger.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    name: Python 3.11 ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Compile (no social sessions)
        run: python -m py_compile tools/relationship_event_ledger.py tests/test_relationship_event_ledger.py
      - name: Offline unit tests
        run: python -m unittest discover -s tests -p test_relationship_event_ledger.py -v
