name: Research 22 - memoria contextual offline

on:
  push:
    branches:
      - research/12-replies-context-memory
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory:
    name: python311-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check "pytest>=8,<10"
      - name: Sintaxis de la pieza comun
        run: python -m compileall -q tools/reply_context_memory.py tools/reply_writer.py tests/test_reply_context_memory.py
      - name: Pruebas sin acceso a redes
        env:
          PYTHONPATH: tests/offline_guard
        run: python -m pytest -q tests/test_reply_context_memory.py -p no:cacheprovider
