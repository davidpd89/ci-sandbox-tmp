name: Relationship state machine (offline)
on:
  push:
    branches:
      - research/50-relationship-state-machine
  pull_request:
    branches:
      - research/public-reuse-parent
    paths:
      - tools/relationship_machine.py
      - tests/test_relationship_machine.py
      - .github/workflows/relationship-state-machine.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relationship-model:
    name: lifecycle / ${{ matrix.os }} / py311
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Synthetic offline contract
        run: python -m unittest discover -s tests -p test_relationship_machine.py -v
      - name: Compile module
        run: python -m py_compile tools/relationship_machine.py
