name: Native target candidate ingest (synthetic)
on:
  push:
    branches:
      - research/native-target-candidate-ingest
  pull_request:
    paths:
      - tools/native_target_candidate_ingest.py
      - tests/test_native_target_candidate_ingest.py
      - .github/workflows/native-target-candidate-ingest.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Synthetic tests without accounts or network access
        run: python -m unittest discover -s tests -p test_native_target_candidate_ingest.py -v
      - name: Official ranking contract regression
        run: python -m unittest discover -s tests -p test_target_quality_ranking.py -v
      - name: Compile adapters and real ranker
        run: python -m py_compile tools/native_target_candidate_ingest.py tools/target_quality_ranking.py
